openapi: 3.0.0
info:
  title: MBTI API
  version: 0.1.0
components:
  schemas:
    SubmitTestResponse:
      type: object
      properties:
        resultId:
          type: string
          format: uuid
        guestToken:
          type: string
          nullable: true
          format: uuid
          description: Set for guests only (every request is a guest for now)
        mbtiType:
          type: string
          minLength: 4
          maxLength: 4
        character:
          type: object
          properties:
            name:
              type: string
            house:
              type: string
            imageUrl:
              type: string
            description:
              type: string
          required:
            - name
            - house
            - imageUrl
            - description
        goldenPairType:
          type: string
          minLength: 4
          maxLength: 4
      required:
        - resultId
        - guestToken
        - mbtiType
        - character
        - goldenPairType
    InvalidAnswersResponse:
      type: object
      properties:
        error:
          type: string
          enum:
            - INVALID_ANSWERS
      required:
        - error
    SubmitTestRequest:
      type: object
      properties:
        answers:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 5
          minItems: 20
          maxItems: 20
          description: 20 answers, each an integer from 1 to 5
      required:
        - answers
  parameters: {}
paths:
  /test/submit:
    post:
      tags:
        - Assessment
      summary: Submit test answers and get the matched character
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitTestRequest"
      responses:
        "201":
          description: Result recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitTestResponse"
        "400":
          description: Answers are missing, incomplete, or out of range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidAnswersResponse"
