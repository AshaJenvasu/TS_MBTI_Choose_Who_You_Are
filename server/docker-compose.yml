name: mbti_app

services:
  postgres:
    container_name: mbti_app_postgres
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mbti
      POSTGRES_PASSWORD: mbti
      POSTGRES_DB: mbti
    ports:
      - "5433:5432"
    volumes:
      - mbti_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mbti -d mbti"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  mbti_pgdata:
